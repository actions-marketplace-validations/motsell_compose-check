name: 'Compose Check manual runner smoke'
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Existing synthetic fixture
        uses: ./
        with:
          json_file: examples/compose.json
      - name: Important cues remain advisory by default
        uses: ./
        with:
          json_file: 'examples/smoke important.json'
      - name: Explicit gate fails for important synthetic cues
        id: strict
        uses: ./
        continue-on-error: true
        with:
          json_file: 'examples/smoke important.json'
          fail_on_important: 'true'
      - name: Invalid input fails without printing the path
        id: invalid
        uses: ./
        continue-on-error: true
        with:
          json_file: examples/absent-smoke-fixture.json
      - name: Confirm expected failure outcomes
        env:
          STRICT_OUTCOME: ${{ steps.strict.outcome }}
          INVALID_OUTCOME: ${{ steps.invalid.outcome }}
        run: |
          test "$STRICT_OUTCOME" = failure
          test "$INVALID_OUTCOME" = failure
          printf '%s\n' 'Expected strict and invalid-input failures observed.'
